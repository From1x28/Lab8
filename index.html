<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Більше число</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        .game-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .player-box {
            text-align: center;
        }

        .score {
            background-color: #00bfff;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .circle {
            width: 60px;
            height: 60px;
            background-color: #ffd700;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            margin: 0 auto;
        }

        button {
            background-color: #00ff00;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #00dd00;
        }

        #message {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        @media (max-width: 400px) {
            .game-container {
            }
                flex-direction: column;
                gap: 20px;
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
     
        <div class="player-box">
            <div id="user-score" class="score">User: 0</div>
            <div id="user-num" class="circle">0</div>
        </div>

        <button id="btn">Generate</button>

        <div class="player-box">
            <div id="comp-score" class="score">Computer: 0</div>
            <div id="comp-num" class="circle">0</div>
        </div>
    </div>

    <div id="message"></div>

    <script src="script.js"></script>
</body>
</html>
